# Replace project.example.com with the actual DNS hostname.
# Enable this HTTP-only configuration before requesting the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name project.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
