# Replace project.example.com with the actual DNS hostname.
# Install only after obtaining the certificate with nginx-http.conf.
server {
    listen 80;
    listen [::]:80;
    server_name project.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name project.example.com;

    ssl_certificate /etc/letsencrypt/live/project.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/project.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/yp666/current/apps/web/dist;
    index index.html;
    client_max_body_size 27m;
    client_header_timeout 30s;
    client_body_timeout 30s;
    send_timeout 60s;

    access_log /var/log/nginx/yp666-access.log;
    error_log /var/log/nginx/yp666-error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the public edge: discard any client-supplied forwarding chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /opt/yp666/current/apps/admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Environment files, Git metadata and other dotfiles are never public.
    location ~ /\. {
        deny all;
    }
}
